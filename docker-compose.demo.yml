# DEVELOPMENT ONLY — fake AI endpoints, not real translations or OCR/transcription.
# PostgreSQL and API network are isolated; only API is published on host loopback.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: translify
      POSTGRES_USER: translify
      POSTGRES_PASSWORD: ${TRANSLIFY_DEMO_DB_PASSWORD:?Run scripts/start-local-demo.sh to generate .env.demo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translify -d translify"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - translify_demo_db:/var/lib/postgresql/data
    restart: unless-stopped
  demo_ai:
    build: ./demo_ai
    restart: unless-stopped
  api:
    build: ./server_core
    environment:
      DATABASE_USER: translify
      DATABASE_PASSWORD: ${TRANSLIFY_DEMO_DB_PASSWORD:?Missing demo database password}
      DATABASE_NAME: translify
      DATABASE_SOCKET: db
      SECRET_KEY: ${TRANSLIFY_DEMO_SECRET_KEY:?Missing demo signing secret}
      TRANSLATE_SERVICE: http://demo_ai:8080
      IMAGE_TO_TEXT_SERVICE: http://demo_ai:8080
      SPEECH_TO_TEXT_SERVICE: http://demo_ai:8080
      SUPPORTED_LANGUAGES: en,es,fr
      CORS_ALLOWED_ORIGINS: ''
    ports:
      - '127.0.0.1:8000:8080'
    depends_on:
      db:
        condition: service_healthy
      demo_ai:
        condition: service_started
    # Development-only schema creation. Production needs real migrations.
    command: ["sh", "-c", "python -m app.init_db && exec uvicorn app.main:app --host 0.0.0.0 --port 8080"]
    restart: unless-stopped
volumes:
  translify_demo_db:
